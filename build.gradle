plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.growth360'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'com.h2database:h2:2.2.224'
    // Smile ML — Real Machine Learning (Random Forest, Isolation Forest, K-Means, Logistic Regression)
    implementation 'com.github.haifengl:smile-core:3.1.1'
    // JSON parsing for Ollama & Gemini LLM API responses
    implementation 'org.json:json:20240303'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.base']
}

application {
    mainClass = 'com.growth360.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Runs the standalone embedded Localhost Web Server & AI Copilot on port 8080'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.growth360.server.ServerMain'
}
